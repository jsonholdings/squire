[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "squire-offload"
version = "0.2.21"
description = "Local sidekick for Claude Code: offload bulk text (test output, logs, diffs, search) to your own GPU."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
license = { text = "Apache-2.0" }
authors = [
    { name = "JSON Holdings" },
]
keywords = [
    "claude-code",
    "llm",
    "ollama",
    "local-inference",
    "cli",
    "token-savings",
    "developer-tools",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]

[project.urls]
# Placeholders -- filled in when the JSON Holdings GitHub organization is created
# (SPEC-OPEN-SOURCE.md "Decided"); do not invent a URL before then.
Homepage = "https://github.com/PLACEHOLDER-ORG/squire"
Repository = "https://github.com/PLACEHOLDER-ORG/squire"
Issues = "https://github.com/PLACEHOLDER-ORG/squire/issues"
Changelog = "https://github.com/PLACEHOLDER-ORG/squire/blob/main/CHANGELOG.md"

[project.scripts]
squire = "squire:main"

[tool.setuptools]
py-modules = ["squire"]

[tool.pytest.ini_options]
testpaths = ["tests"]
