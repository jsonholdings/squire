[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "squire-offload"
version = "0.1.0.dev0"
description = "Local sidekick for Claude Code: offload bulk text (test output, logs, drafts) to your own GPU via Ollama."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
squire = "squire:main"

[tool.setuptools]
py-modules = ["squire"]

[tool.pytest.ini_options]
testpaths = ["tests"]
